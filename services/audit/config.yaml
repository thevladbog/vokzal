# Port 8098 must match Traefik (audit-service) and start-services.ps1 $portMap (audit uses non-sequential port)
server:
  port: "8098"
  mode: "debug"

database:
  host: "localhost"
  port: 5440
  user: "${VOKZAL_DB_USER}"
  password: "${VOKZAL_DB_PASSWORD}"
  dbname: "vokzal"
  sslmode: "disable"

nats:
  url: "${VOKZAL_NATS_URL}"
  user: "${VOKZAL_NATS_USER}"
  password: "${VOKZAL_NATS_PASSWORD}"

logger:
  level: "debug"
