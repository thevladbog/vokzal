server:
  port: "8089"
  mode: "debug"

database:
  host: "${DB_HOST:-localhost}"
  port: 5440
  user: "${DB_USER}"
  password: "${DB_PASSWORD}"
  dbname: "${DB_NAME:-vokzal}"
  sslmode: "disable"

nats:
  url: "${NATS_URL:-nats://localhost:4222}"
  user: "${NATS_USER}"
  password: "${NATS_PASSWORD}"

logger:
  level: "debug"

# Must match MinIO container (e.g. docker-compose MINIO_ROOT_USER / MINIO_ROOT_PASSWORD)
minio:
  endpoint: "${MINIO_ENDPOINT:-localhost:9000}"
  access_key: "${MINIO_ACCESS_KEY}"
  secret_key: "${MINIO_SECRET_KEY}"
  bucket: "${MINIO_BUCKET:-vokzal-documents}"
  use_ssl: false
