server:
  port: "8082"
  mode: "debug"

database:
  host: "localhost"
  port: 5440
  user: "${VOKZAL_DB_USER}"
  password: "${VOKZAL_DB_PASSWORD}"
  dbname: "vokzal"
  sslmode: "disable"

nats:
  url: "${VOKZAL_NATS_URL}"
  user: "${VOKZAL_NATS_USER}"
  password: "${VOKZAL_NATS_PASSWORD}"

# Override in production via VOKZAL_SCHEDULE_JWT_SECRET; release mode will not start with default secret
jwt:
  secret: "${VOKZAL_SCHEDULE_JWT_SECRET}"

logger:
  level: "debug"
