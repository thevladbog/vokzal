server:
  port: "8084"
  mode: "debug"

database:
  host: "localhost"
  port: 5440
  user: "${VOKZAL_DB_USER}"
  password: "${VOKZAL_DB_PASSWORD}"
  dbname: "vokzal"
  sslmode: "disable"

nats:
  url: "${VOKZAL_NATS_URL}"
  user: "${VOKZAL_NATS_USER}"
  password: "${VOKZAL_NATS_PASSWORD}"

logger:
  level: "debug"

atol:
  company_inn: "1234567890"
  company_name: "ООО «Вокзал.ТЕХ»"
  tax_system: "osn"  # osn, usn_income, usn_income_outcome, esn, patent

# For Docker: use host.docker.internal (agent on host) or service name; override via VOKZAL_FISCAL_LOCAL_AGENT_URL
local_agent:
  url: "http://localhost:8081"
