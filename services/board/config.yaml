server:
  port: "8086"
  mode: "debug"

database:
  host: "localhost"
  port: 5440
  user: "${VOKZAL_DB_USER}"
  password: "${VOKZAL_DB_PASSWORD}"
  dbname: "vokzal"
  sslmode: "disable"

redis:
  host: "localhost"
  port: 6379
  password: "${VOKZAL_REDIS_PASSWORD}"
  db: 0

nats:
  url: "${VOKZAL_NATS_URL}"
  user: "${VOKZAL_NATS_USER}"
  password: "${VOKZAL_NATS_PASSWORD}"

logger:
  level: "debug"
