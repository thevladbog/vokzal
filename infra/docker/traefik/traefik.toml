# Traefik Static Configuration

[log]
  level = "INFO"

[accessLog]
  filePath = "/var/log/traefik/access.log"
  format = "json"

[api]
  dashboard = true
  insecure = true

# EntryPoints: explicit http options for Traefik v3.6+ (request-path percent-encoding behavior).
# No Kubernetes Gateway API / CRD / experimental.kubernetesIngressNGINX in this setup.
[entryPoints]
  [entryPoints.web]
    address = ":80"
    [entryPoints.web.http]
      sanitizePath = true
      [entryPoints.web.http.encodedCharacters]
        allowEncodedSlash = false
        allowEncodedBackSlash = false
        allowEncodedNullCharacter = false
        allowEncodedSemicolon = false
        allowEncodedPercent = false
        allowEncodedQuestionMark = false
        allowEncodedHash = false

  [entryPoints.websecure]
    address = ":443"
    [entryPoints.websecure.http]
      sanitizePath = true
      [entryPoints.websecure.http.encodedCharacters]
        allowEncodedSlash = false
        allowEncodedBackSlash = false
        allowEncodedNullCharacter = false
        allowEncodedSemicolon = false
        allowEncodedPercent = false
        allowEncodedQuestionMark = false
        allowEncodedHash = false

  [entryPoints.metrics]
    address = ":8082"

[providers]
  [providers.docker]
    exposedByDefault = false
    network = "vokzal-network"
  
  [providers.file]
    # Must match docker-compose mount ./traefik/config → /etc/traefik/config (host: ./traefik/config/dynamic/)
    directory = "/etc/traefik/config/dynamic"
    watch = true

[metrics]
  [metrics.prometheus]
    entryPoint = "metrics"
    addEntryPointsLabels = true
    addServicesLabels = true

[certificatesResolvers.letsencrypt.acme]
  email = "admin@vokzal.tech"
  storage = "/letsencrypt/acme.json"
  
  [certificatesResolvers.letsencrypt.acme.httpChallenge]
    entryPoint = "web"
